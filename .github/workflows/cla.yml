name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck'
        uses: contributor-assistant/github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://gist.githubusercontent.com/dev-lu/c34030be30b22f79ece1e33e31ce60ee/raw/CLA.md"
          branch: "main"
          allowlist: dependabot[bot],renovate[bot]
